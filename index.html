<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/devicon@2.16.0/devicon.min.css">
        <link rel="stylesheet" href="styles.css?v=3">
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%234361ee%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237209b7%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2248%22%20fill%3D%22url%28%23g%29%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2266%22%20font-size%3D%2244%22%20font-family%3D%22Consolas%2C%20Menlo%2C%20Monaco%2C%20monospace%22%20font-weight%3D%22900%22%20text-anchor%3D%22middle%22%20fill%3D%22%23ffffff%22%3E%26lt%3B/%26gt%3B%3C/text%3E%3C/svg%3E">
        <title>Samarth's Portfolio</title>
    </head>
    <body>
        <div id="progress-bar"></div>
        <nav class="navigation">
            <div id="title">
                <span class="title-symbol">&lt;/&gt;</span>
                <p id="nav-name"></p>
            </div>
            <button id="menu-toggle" aria-label="Toggle menu">&#9776;</button>
            <div id="links">
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#journey">Journey</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>

        <header id="banner">
            <div class="hero-blob" aria-hidden="true"></div>
            <div id="hero-intro">
                <p class="hero-kicker">&#128075; <span id="typing-text"></span><span id="typing-cursor">|</span></p>
                <h1 class="hero-greeting">Hi, I'm <span class="gradient-text" id="hero-name"></span></h1>
                <p class="hero-tagline" id="hero-tagline"></p>
                <div id="hero-buttons">
                    <a href="#projects" class="btn btn-primary">View Projects</a>
                    <a href="#contact" class="btn btn-secondary">Get in Touch</a>
                </div>
            </div>
            <div id="hero-image">
                <img id="hero" src="" alt="">
            </div>
        </header>

        <section id="about" class="section reveal">
            <h2 class="section-title">About Me</h2>
            <div id="about-content">
                <p class="section-text" id="about-bio"></p>
                <div id="skills"></div>
            </div>
        </section>

        <section id="projects" class="section reveal">
            <h2 class="section-title">Projects</h2>
            <div id="project-grid"></div>
            <div id="more-projects"></div>
        </section>

        <section id="journey" class="section reveal">
            <h2 class="section-title">Journey</h2>
            <div class="timeline" id="timeline"></div>
        </section>

        <section id="contact" class="section reveal">
            <h2 class="section-title">Contact</h2>
            <div id="contact-grid">
                <div class="contact-form-wrap">
                    <h3>Get in Touch</h3>
                    <form id="contact-form">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="user_name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="user_email" required>

                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>

                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                    <p id="form-status" role="status"></p>
                </div>

                <aside class="contact-info">
                    <h3 id="contact-heading"></h3>
                    <p id="contact-intro"></p>

                    <div class="contact-details">
                        <a href="" class="contact-detail" id="copy-email">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 7L2 7"></path></svg>
                            <span id="contact-email-text"></span>
                            <span class="copy-hint">Click to copy</span>
                        </a>
                        <div class="contact-detail">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-7.58 8-13a8 8 0 1 0-16 0c0 5.42 8 13 8 13Z"></path><circle cx="12" cy="9" r="3"></circle></svg>
                            <span id="contact-location"></span>
                        </div>
                        <div class="contact-detail">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
                            <span id="local-time">Loading local time&hellip;</span>
                        </div>
                    </div>

                    <a href="" download class="btn btn-secondary btn-resume" id="resume-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
                        Download Resume
                    </a>

                    <div class="social-links" id="social-links"></div>
                </aside>

                <p class="contact-copyright">&copy; <span id="year"></span> Samarth. All rights reserved.</p>
            </div>
        </section>

        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
